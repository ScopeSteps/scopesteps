<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ScopeSteps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: chat-first app shell — slim left sidebar (navigation + account), one focused view at a time, side sheet for evidence.
   Palette: slate neutrals, one accent (indigo default, teal optional), light / dark / system. */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --hover:#EEF2F6; --line:#E2E8F0; --line-strong:#CBD5E1;
  --fg:#0F172A; --muted:#475569; --subtle:#64748B;
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-fg:#FFFFFF; --accent-soft:#EEF2FF; --accent-ink:#4338CA; --accent-line:#C7D2FE;
  --warn-soft:#FFF7ED; --warn-line:#FDBA74; --warn-ink:#9A3412;
  --bad-soft:#FEF2F2; --bad-line:#FECACA; --bad-ink:#B91C1C;
  --ok-soft:#ECFDF5; --ok-ink:#047857;
  --shadow:0 10px 30px rgba(15,23,42,.12); --scrim:rgba(15,23,42,.32);
  --font:'Figtree','Segoe UI','Helvetica Neue',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#1E293B; --surface-2:#172033; --hover:#243149; --line:#334155; --line-strong:#475569;
  --fg:#F8FAFC; --muted:#94A3B8; --subtle:#94A3B8;
  --accent:#6366F1; --accent-hover:#818CF8; --accent-fg:#FFFFFF; --accent-soft:#272C5E; --accent-ink:#A5B4FC; --accent-line:#3F468A;
  --warn-soft:#3A2614; --warn-line:#9A5B1F; --warn-ink:#FDBA74; --bad-soft:#3A1D24; --bad-line:#7F2A35; --bad-ink:#FCA5A5; --ok-soft:#113A2E; --ok-ink:#6EE7B7;
  --shadow:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(2,6,23,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#172033; --hover:#243149; --line:#334155; --line-strong:#475569;
  --fg:#F8FAFC; --muted:#94A3B8; --subtle:#94A3B8;
  --accent:#6366F1; --accent-hover:#818CF8; --accent-fg:#FFFFFF; --accent-soft:#272C5E; --accent-ink:#A5B4FC; --accent-line:#3F468A;
  --warn-soft:#3A2614; --warn-line:#9A5B1F; --warn-ink:#FDBA74; --bad-soft:#3A1D24; --bad-line:#7F2A35; --bad-ink:#FCA5A5; --ok-soft:#113A2E; --ok-ink:#6EE7B7;
  --shadow:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(2,6,23,.6); color-scheme:dark}
/* Teal accent option */
:root[data-accent="teal"]{--accent:#0F766E; --accent-hover:#115E59; --accent-fg:#FFFFFF; --accent-soft:#F0FDFA; --accent-ink:#0F766E; --accent-line:#99F6E4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-accent="teal"]{--accent:#2DD4BF; --accent-hover:#5EEAD4; --accent-fg:#042F2E; --accent-soft:#123B39; --accent-ink:#5EEAD4; --accent-line:#1F5F5A}}
:root[data-theme="dark"][data-accent="teal"]{--accent:#2DD4BF; --accent-hover:#5EEAD4; --accent-fg:#042F2E; --accent-soft:#123B39; --accent-ink:#5EEAD4; --accent-line:#1F5F5A}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.id{font-family:var(--mono);font-variant-numeric:tabular-nums}
.id{font-size:12px;color:var(--subtle)}
.muted{color:var(--muted)} .small{font-size:12px;color:var(--subtle)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* Buttons */
.btn{min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad-line);background:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface)}
.btn.primary[disabled]:hover{background:var(--accent)}
.iconbtn{width:36px;height:36px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.linkbtn{background:none;border:none;padding:0;color:var(--accent-ink);cursor:pointer;font-size:13px;font-weight:500}
.linkbtn:hover{text-decoration:underline}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;line-height:1.5}
.t-acc{background:var(--accent-soft);color:var(--accent-ink)}
.t-neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.t-warn{background:var(--warn-soft);color:var(--warn-ink)}
.t-bad{background:var(--bad-soft);color:var(--bad-ink)}
.t-ok{background:var(--ok-soft);color:var(--ok-ink)}
.cite{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);cursor:pointer;white-space:nowrap;line-height:1.6}
.cite:hover{border-color:var(--accent)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* App shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.sidebar{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px}
.sb-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.sb-project{padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--subtle)}
.sb-project strong{font-size:14px;overflow-wrap:anywhere}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{width:100%;min-height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
.nav-item:hover{background:var(--hover);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08);border:1px solid var(--line)}
.nav-item .badge{margin-left:auto}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;position:relative}
.demo-note{font-size:11px;color:var(--subtle);padding:0 8px}
.user-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left}
.user-btn:hover{background:var(--hover)}
.user-btn .nm{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.user-btn .nm strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-btn .nm span{font-size:12px;color:var(--subtle)}
.av{flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:600}
.avimg{border-radius:50%;object-fit:cover;display:block;flex:none}
.menu{position:absolute;bottom:58px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:25;display:flex;flex-direction:column}
.menu .who{display:flex;flex-direction:column;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{min-height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:var(--fg)}
.menu button:hover{background:var(--hover)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:var(--bg)}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.tb-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ver-chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.next-pill{min-height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.next-pill:hover{border-color:var(--accent)}
.next-pill.static{cursor:default}
.next-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.only-mobile{display:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* Popover (run details) */
.pop-wrap{position:relative}
.pop{position:absolute;top:42px;right:0;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;z-index:25;display:flex;flex-direction:column;gap:8px;font-size:13px}
.kvrow{display:flex;justify-content:space-between;gap:10px}
.kvrow b{font-family:var(--mono);font-weight:500}

/* Chat */
.thread{flex:1;min-height:0;overflow:auto}
.thread-inner{max-width:760px;margin:0 auto;padding:28px 20px 12px;display:flex;flex-direction:column;gap:22px}
.m-agent{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.m-agent .mk{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.m-body{display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:3px;line-height:1.6;font-size:15px}
.m-body p+p{margin-top:2px}
.m-user{align-self:flex-end;max-width:80%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.m-user .who{font-size:12px;color:var(--subtle);font-weight:500}
.m-user .bub{padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.55;white-space:pre-wrap}
.m-event{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--subtle);text-align:center}
.m-event::before,.m-event::after{content:"";flex:1;height:1px;background:var(--line)}
.found{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.found li{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center}
.found .tag{justify-self:start}
.card{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:14px}
.card.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.decide{border-color:var(--warn-line);background:var(--warn-soft)}
.card .q{font-size:15px;font-weight:600;line-height:1.4}
.card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans{margin:0;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.working{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{50%{opacity:.25}}
.newchat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 8px 8px}
.newchat h2{font-size:22px;letter-spacing:-.01em}
.newchat > p{max-width:52ch}
.mk-lg{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--fg);display:flex;align-items:center;justify-content:center}
.steps{list-style:none;margin:10px 0 0;padding:0;width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;text-align:left}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.step-n{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line-strong);color:var(--subtle)}
.step.active{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.step.active .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step.done .step-n{background:var(--ok-soft);border-color:transparent;color:var(--ok-ink)}
.step.todo{opacity:.7}
.welcome{padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.welcome h2{font-size:18px}

.composer-wrap{flex:none;max-width:760px;width:100%;margin:0 auto;padding:6px 20px 16px}
.composer{border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);box-shadow:0 1px 3px rgba(15,23,42,.06);padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{border:none;outline:none;background:transparent;resize:none;width:100%;min-height:26px;max-height:200px;font-size:15px;line-height:1.5;padding:2px 0}
.composer textarea:disabled{cursor:not-allowed}
.cmp-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;max-width:100%}
.ctx-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-chip button{width:20px;height:20px;border:none;border-radius:50%;background:transparent;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cmp-bar{display:flex;align-items:center;gap:6px}
.toggle-chip{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.toggle-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.toggle-chip[disabled]{opacity:.45;cursor:not-allowed}
.cmp-count{margin-left:auto;font-size:12px;color:var(--subtle);font-family:var(--mono)}
.send{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-fg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.send:hover{background:var(--accent-hover)}
.send[disabled]{opacity:.35;cursor:not-allowed}
.send.stop{background:var(--fg);color:var(--bg)}
.cmp-hint{font-size:11px;color:var(--subtle);text-align:center;margin-top:8px}

/* Pages */
.page-scroll{flex:1;min-height:0;overflow:auto}
.page{max-width:960px;margin:0 auto;padding:24px 24px 56px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.page-head p{max-width:62ch}
.seg{display:inline-flex;align-self:flex-start;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.seg button{min-height:28px;padding:0 10px;border:none;border-radius:6px;background:transparent;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(15,23,42,.1)}
select.sel{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.banner{padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner > span{flex:1;min-width:0}
.banner > svg{flex:none;align-self:flex-start;margin-top:2px}
.banner.info{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.group-h{font-size:12px;font-weight:600;color:var(--subtle);display:flex;gap:8px;padding:8px 2px 0;text-transform:uppercase;letter-spacing:.06em}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.srow{border-top:1px solid var(--line)}
.srow:first-child{border-top:none}
.srow-h{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border:none;background:transparent;cursor:pointer;text-align:left}
.srow-h:hover{background:var(--hover)}
.srow-h .ttl{font-weight:600;font-size:14px;min-width:0;flex:1}
.srow-h .chev{color:var(--subtle);transition:transform .15s}
.srow-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.srow-b{padding:2px 14px 16px 42px;display:flex;flex-direction:column;gap:10px}
.crit{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:14px}
.crit-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crit-top .cites{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.crit.sug{background:var(--warn-soft);border:1px dashed var(--warn-line)}
.crit.blocked{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink)}
.crit.new{border-color:var(--accent-line)}
.crit.rejected{opacity:.6}
.diff{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.diff.added{background:var(--accent);color:var(--accent-fg)}
.diff.modified{background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line)}
.diff.removed{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-strong)}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:13px;font-weight:600}
.field input,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px}
.field textarea{resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.help{font-size:12px;color:var(--subtle)}
.err{color:var(--bad-ink);font-size:13px;min-height:0}
.err:empty{display:none}
.empty{max-width:420px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--subtle);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto}
.rowbtn{background:none;border:none;padding:0;cursor:pointer;text-align:left;font-weight:600;color:var(--fg)}
.rowbtn:hover{color:var(--accent-ink);text-decoration:underline}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:160px}
.meter>div{height:100%;background:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px}
.person.flag{border-color:var(--warn-line);box-shadow:0 0 0 3px var(--warn-soft)}
.person-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:60px 130px minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border-top:none}
.log .t{font-family:var(--mono);color:var(--subtle)}
.log .w{font-weight:600}
.cr{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}

/* Sheet + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:31;display:flex;flex-direction:column}
.sheet-h,.modal-h{padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2,.modal-h h2{font-size:16px;font-weight:600}
.sheet-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-f,.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal-wrap{position:fixed;inset:0;z-index:31;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(760px,100%);height:min(600px,calc(100% - 32px))}
.modal-b{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.quote{margin:0;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;line-height:1.55}
.paras{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.paras li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:8px;border-radius:8px}
.paras li.hl{background:var(--accent-soft)}
.paras li.inj{background:var(--bad-soft)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.ck{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ck.ok{background:var(--ok-soft);color:var(--ok-ink)} .ck.no{background:var(--bad-soft);color:var(--bad-ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:0}
.kv dt{font-size:12px;color:var(--subtle)} .kv dd{margin:0;font-weight:600}
.exportbox{width:100%;min-height:240px;font-family:var(--mono);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);resize:vertical}
.drop{border:1px dashed var(--line-strong);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.settings{display:grid;grid-template-columns:180px minmax(0,1fr);flex:1;min-height:0}
.set-nav{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-bottom-left-radius:14px}
.set-nav button{min-height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);text-align:left;font-weight:500}
.set-nav button:hover{background:var(--hover);color:var(--fg)}
.set-nav button[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;border:1px solid var(--line)}
.set-body{overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.set-body h3{font-size:15px}
.opt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .pv{height:52px;border-radius:6px;border:1px solid var(--line);display:flex;overflow:hidden}
.opt span{font-size:13px;font-weight:600}
.swatch{width:22px;height:22px;border-radius:50%;flex:none}
.danger-zone{border:1px solid var(--bad-line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.perm-list{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.pf-photo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sr:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 32px)}

/* Login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:32px;background:var(--bg)}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:20px}
.login-card .box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login-card h1{font-size:22px;letter-spacing:-.01em}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px!important}
.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:28px;padding:0 8px;border:none;background:transparent;color:var(--accent-ink);cursor:pointer;font-size:13px;font-weight:600}
.demo-acct{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.demo-acct:hover{border-color:var(--accent-line);background:var(--hover)}
.divider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--subtle)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* Project switcher + sidebar toggle */
.sidebar{position:relative}
.proj-wrap{position:relative;margin-bottom:10px}
.sb-project{width:100%;text-align:left;cursor:pointer;margin-bottom:0}
.sb-project:hover{border-color:var(--line-strong)}
.sb-project .row{justify-content:space-between;flex-wrap:nowrap}
.pmenu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:25;display:flex;flex-direction:column}
.pmenu button{min-height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:var(--fg)}
.pmenu button:hover{background:var(--hover)}
.tb-toggle{display:none}
@media (min-width:901px){
  .app.sb-collapsed{grid-template-columns:minmax(0,1fr)}
  .app.sb-collapsed .sidebar{display:none}
  .app.sb-collapsed .tb-toggle{display:inline-flex}
}
@media (max-width:900px){ .tb-toggle{display:inline-flex} }

/* Responsive */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(280px,85%);z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .only-mobile{display:inline-flex}
  .topbar{padding:0 12px}
  .ver-chip{display:none}
  .settings{grid-template-columns:minmax(0,1fr)}
  .set-nav{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);border-radius:0}
  .opt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srow-b{padding-left:14px}
  .log li{grid-template-columns:52px minmax(0,1fr)}
  .log li .w{grid-column:2}
  .log li span:last-child{grid-column:2}
}
@media (min-width:901px){ .sb-close{display:none} .nav-scrim{display:none!important} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  if (S.phase === 'clarify'){ const n = ['Q1','Q2'].filter(k => S.questions[k].status === 'open').length; return {short:'Answer ' + plural(n, 'question'), act:'go-question'}; }
  const lb = liveBacklog();
  if (lb && lb.mode === 'draft'){
    const st = stats(lb.b);
    if (st.pending || st.blocked) return {short:'Review ' + plural(st.pending + st.blocked, 'item'), act:'go-attention'};
    return {short:'Approve baseline v1', act:'open-approve', approverOnly:true, waitShort:'Ready for approval'};
  }
  if (S.candidate){
    const c = S.candidate, st = stats(c.backlog);
    if (c.reverse == null) return {short:'Decide on EX-01', act:'go-decision', approverOnly:true, waitShort:'Waiting for a scope decision'};
    if (c.reverse === 'no') return {short:'Reject the change', act:'reject', approverOnly:true, waitShort:'Waiting for a Product owner'};
    if (st.pending || st.blocked) return {short:'Finish ' + plural(st.pending + st.blocked, 'item'), act:'go-attention'};
    return {short:'Approve v' + (c.base + 1), act:'open-approve', approverOnly:true, waitShort:'Ready for approval'};
  }
  if (S.versions.length) return {short:'Request a change', act:'new-change'};
  return {short:''};
}

const DIFF_TAG = {added:'<span class="diff added">+ Added</span>', modified:'<span class="diff modified">~ Changed</span>', removed:'<span class="diff removed">− Removed</span>'};
function critRow(c, s, ctx){
  const i = critInfo(c), ed = ctx.editable;
  if (c.status === 'rejected') return '<div class="crit rejected"><div class="crit-top"><span class="id">' + c.id + '</span><span class="tag t-neutral">Rejected</span>' + (ed ? '<button class="linkbtn" style="margin-left:auto" data-act="undo-reject" data-s="' + s.id + '" data-c="' + c.id + '">Undo</button>' : '') + '</div><s class="muted">' + esc(i.text) + '</s></div>';
  if (i.blocked) return '<div class="crit blocked"><div class="crit-top"><span class="id" style="color:inherit">' + c.id + '</span><span class="tag t-bad">Waiting on ' + c.q + '</span>' + (c.isNew ? DIFF_TAG.added : '') + '</div><p>' + esc(i.q.text) + '</p>' + (ed && !i.q.locked ? '<div><button class="btn sm" data-act="reply" data-q="' + c.q + '">Answer ' + c.q + ' in chat</button></div>' : '') + '</div>';
  const sug = c.origin === 'suggested', pending = sug && c.status === 'pending';
  let label = pending ? '<span class="tag t-warn">Agent suggestion · no source</span>' : sug ? '<span class="tag t-warn">Suggestion · accepted</span>' : c.origin === 'human' ? '<span class="tag t-neutral">Added by a person</span>' : (c.edited || c.fixed) ? '<span class="tag t-neutral">Edited</span>' : '';
  let h = '<div class="crit' + (pending ? ' sug' : '') + (c.isNew ? ' new' : '') + '"><div class="crit-top"><span class="id">' + c.id + '</span>' + label + (c.isNew ? DIFF_TAG.added : '') + '<span class="cites">' + i.cites.map(citeBtn).join('') + '</span></div><p>' + esc(i.text) + '</p>';
  if (pending && ed) h += '<div class="row"><button class="btn sm primary" data-act="accept" data-s="' + s.id + '" data-c="' + c.id + '">Accept</button><button class="btn sm" data-act="reject-crit" data-s="' + s.id + '" data-c="' + c.id + '">Reject</button></div>';
  return h + '</div>';
}
function editForm(b){

function compareVersions(a, b){
  const key = s => JSON.stringify([s.title, s.text, s.criteria.map(c => c.text)]);
  const A = {}, B = {}; a.data.stories.forEach(s => A[s.id] = s); b.data.stories.forEach(s => B[s.id] = s);
  const rows = Array.from(new Set(Object.keys(A).concat(Object.keys(B)))).sort().map(id => {
    const x = A[id], y = B[id];
    if (!x) return {id, title:y.title, kind:'added'};
    if (!y) return {id, title:x.title, kind:'removed'};
    if (key(x) !== key(y)){ const xc = x.criteria.map(c => c.text), yc = y.criteria.map(c => c.text); const add = yc.filter(t => xc.indexOf(t) < 0).length, rem = xc.filter(t => yc.indexOf(t) < 0).length;
      return {id, title:y.title, kind:'modified', note:[add ? plural(add, 'criterion', 'criteria') + ' added' : '', rem ? rem + ' removed' : '', x.title !== y.title ? 'title changed' : ''].filter(Boolean).join(', ') || 'text changed'}; }
    return {id, title:y.title, kind:'same'};
  });
  const XA = {}, XB = {}; (a.data.exclusions || []).forEach(x => XA[x.id] = x); (b.data.exclusions || []).forEach(x => XB[x.id] = x);
  Object.keys(XA).forEach(id => { if (!XB[id]) rows.push({id, title:'Exclusion: ' + XA[id].title, kind:'removed'}); });
  Object.keys(XB).forEach(id => { if (!XA[id]) rows.push({id, title:'Exclusion: ' + XB[id].title, kind:'added'}); });
  return rows;
}

  const b = S.editBuf; if (!b) return;
  const t = $('#ed-title'), x = $('#ed-text'); if (t) b.title = t.value; if (x) b.text = x.value;

function saveEdit(){
  syncBuf();
  const b = S.editBuf, s = findStory(b.id); if (!s) return;
  let changed = false;
  if (b.title.trim() && b.title.trim() !== s.title){ s.title = b.title.trim(); changed = true; }
  if (b.text.trim() && b.text.trim() !== s.text){ s.text = b.text.trim(); changed = true; }
  const next = [];
  b.criteria.forEach(c => {
    const orig = s.criteria.find(o => o.id === c.id);
    if (c._val === undefined){ if (orig) next.push(orig); return; }
    const val = c._val.trim();
    if (!orig){ if (val){ next.push({id:c.id, text:val, cites:[], origin:'human', isNew:!!S.candidate}); changed = true; } return; }
    if (!val || val === critInfo(orig).text){ next.push(orig); return; }
    if (orig.q){ orig.fixed = true; orig.cites = [orig.q].concat(orig.cites || []); }
    orig.text = val; orig.edited = true; changed = true;
    if (orig.origin === 'suggested' && orig.status === 'pending') orig.status = 'accepted';
    next.push(orig);
  });
  s.criteria = next;
  if (changed){ s.edited = true; if (S.candidate && !s.diff) s.diff = 'modified'; bumpRevision(); log('You', 'Edited ' + s.id); toast('Saved. Edits are labeled on the story.'); }

  switch (a){
    case 'demo-fill': { const acct = ACCOUNTS.find(x => x.id === el.dataset.id); $('#li-email').value = acct.email; $('#li-pw').value = acct.pw; $('#li-err').textContent = ''; $('#li-submit').focus(); break; }
    case 'toggle-pw': { const pw = $('#li-pw'), show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; el.textContent = show ? 'Hide' : 'Show'; el.setAttribute('aria-pressed', String(show)); el.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); break; }
    case 'go': S.view = el.dataset.v; navOpen = false; S.sheet = null; if (S.view !== 'backlog') S.viewV = null; render(S.view === 'chat'); $('#page-scroll').scrollTop = 0; break;
    case 'nav-open': navOpen = true; renderSidebar(); { const f = document.querySelector('.nav-item'); if (f) f.focus(); } break;
    case 'nav-close': navOpen = false; renderSidebar(); break;
    case 'user-menu': menuOpen = !menuOpen; renderSidebar(); if (menuOpen){ const f = document.querySelector('.menu [role="menuitem"]'); if (f) f.focus(); } break;
    case 'open-settings': openSettings(el.dataset.tab); break;
    case 'set-tab': syncProfile(); S.modal.tab = el.dataset.tab; S.modal.error = ''; resetArmed = false; renderLayer(); break;
    case 'save-profile': saveProfile(); break;
    case 'pf-remove-photo': syncProfile(); S.modal.draft.photo = null; S.modal.error = ''; renderLayer(); break;
    case 'sign-out': signOut(); break;
    case 'run-pop': runPop = !runPop; renderTopbar(); break;
    case 'focus-name': if (S.projectName){ S.modal = {type:'project'}; renderLayer(); break; } goChat(); setTimeout(() => { const i = $('#proj-name'); if (i) i.focus(); }, 0); break;
    case 'go-question': { S.view = 'chat'; navOpen = false; render(true); const q = Object.values(S.questions).find(x => x.status === 'open' && !x.locked); if (q){ const c = document.getElementById('q-' + q.id); if (c) c.scrollIntoView({block:'center'}); } break; }
    case 'go-decision': { S.view = 'chat'; render(true); const c = $('#decision-card'); if (c) c.scrollIntoView({block:'center'}); break; }
    case 'go-attention': S.view = 'backlog'; S.viewV = null; S.filter = 'attention'; S.open = {}; render(); break;
    case 'view-candidate': S.view = 'backlog'; S.viewV = null; S.filter = 'changes'; S.open = {}; render(); break;
    case 'new-change': S.replyTo = null; S.crMode = true; goChat(true); break;
    case 'toggle-cr': S.crMode = !S.crMode; if (S.crMode) S.replyTo = null; renderChat(); $('#cmp').focus(); break;
    case 'reply': S.replyTo = el.dataset.q; S.crMode = false; goChat(true); { const c = document.getElementById('q-' + el.dataset.q); if (c) c.scrollIntoView({block:'nearest'}); } break;
    case 'example': S.replyTo = el.dataset.q; S.crMode = false; $('#cmp').value = EXAMPLES[el.dataset.q] || ''; goChat(true); autosize(); updateCount(); break;
    case 'clear-reply': S.replyTo = null; renderChat(); $('#cmp').focus(); break;
    case 'skip': if (S.replyTo === el.dataset.q) S.replyTo = null; skipQuestion(el.dataset.q); break;
    case 'draft-now': ['Q1','Q2'].forEach(k => { if (S.questions[k].status === 'open'){ S.questions[k].status = 'skipped'; log('You', 'Skipped ' + k); } }); S.replyTo = null; S.messages.push({role:'event', text:user.name + ' asked for a draft now. Skipped questions stay open.'}); S.view = 'chat'; startWork('draft'); break;
    case 'stop': stopWork(); break;
    case 'resume': S.view = 'chat'; resumeWork(); break;
    case 'decide': decide(+el.dataset.i, el.dataset.v); break;
    case 'toggle-story': { const id = el.dataset.s; const now_ = el.getAttribute('aria-expanded') === 'true'; S.open[id] = !now_; if (S.editing === id && now_){ S.editing = null; S.editBuf = null; } renderPage(); break; }
    case 'filter': S.filter = el.dataset.f; S.open = {}; renderPage(); break;
    case 'accept': case 'reject-crit': case 'undo-reject': {
      const s = findStory(el.dataset.s), c = s && s.criteria.find(x => x.id === el.dataset.c); if (!c) break;
      c.status = a === 'accept' ? 'accepted' : a === 'reject-crit' ? 'rejected' : 'pending';
      S.open[s.id] = true; bumpRevision();
      log('You', (a === 'accept' ? 'Accepted' : a === 'reject-crit' ? 'Rejected' : 'Restored') + ' agent suggestion ' + s.id + ' ' + c.id); render(); break; }
    case 'edit': { const s = findStory(el.dataset.s); if (!s) break; S.editing = s.id; S.editBuf = clone(s); S.open[s.id] = true; renderPage(); const t = $('#ed-title'); if (t) t.focus(); break; }
    case 'add-crit': { syncBuf(); const b = S.editBuf; b.criteria.push({id:'AC-' + (b.criteria.length + 1), text:'', cites:[], origin:'human', _val:''}); renderPage(); const f = document.getElementById('ed-c-' + (b.criteria.length - 1)); if (f) f.focus(); break; }
    case 'save-edit': saveEdit(); break;
    case 'cancel-edit': S.editing = null; S.editBuf = null; renderPage(); break;
    case 'confirm-person': { const p = S.stakeholders.find(x => x.id === el.dataset.id); p.confirmed = el.dataset.v || null; p.confirmedBy = p.confirmed ? user.name : null; log('You', 'Set decision rights for ' + p.name + ': ' + (p.confirmed === 'decides' ? 'can decide scope' : p.confirmed === 'advises' ? 'advises only' : 'unknown')); render(); break; }
    case 'edit-person': S.editPerson = el.dataset.id; renderPage(); { const i = $('#pe-name'); if (i) i.focus(); } break;
    case 'cancel-person': S.editPerson = null; renderPage(); break;
    case 'cite': S.sheet = {type:'cite', key:el.dataset.key}; S.modal = null; renderLayer(); break;
    case 'open-source': S.sheet = {type:'source', id:el.dataset.id, n:el.dataset.n ? +el.dataset.n : null}; renderLayer(); break;
    case 'remove-source': { const id = el.dataset.id; S.sources = S.sources.filter(s => s.id !== id); log('You', 'Removed source ' + id); S.messages.push({role:'event', text:user.name + ' removed ' + id + '.'}); S.sheet = null; render(); toast(id + ' removed.'); break; }
    case 'add-source': S.modal = {type:'add'}; renderLayer(); break;
    case 'add-sample': addSource('club-requests-email.md', CLUB_EMAIL.slice(), 'club'); break;
    case 'open-approve': S.modal = {type:'approve'}; renderLayer(); break;
    case 'approve': approve(); break;
    case 'reject': rejectCandidate(); break;
    case 'open-export': S.modal = {type:'export', v:el.dataset.v ? +el.dataset.v : (S.versions.length ? cur().v : 0), fmt:'json'}; renderLayer(); break;
    case 'ex-fmt': S.modal.fmt = el.dataset.f; renderLayer(); break;
    case 'copy-export': { const ta = $('#ex-text'); const fb = () => { ta.focus(); ta.select(); toast('Text selected. Press Ctrl+C or ⌘C to copy.'); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast('Copied to clipboard.'), fb); } catch(_) { fb(); } break; }
    case 'close-layer': case 'close-layer-bg': resetArmed = false; if (S.modal) S.modal = null; else S.sheet = null; renderLayer(); break;
    case 'reset':
      if (!resetArmed){ resetArmed = true; renderLayer(); setTimeout(() => { if (resetArmed){ resetArmed = false; if (S.modal && S.modal.type === 'project') renderLayer(); } }, 4000); }
      else { resetArmed = false; clearTimeout(timer); S = initialState(); store.projects[store.current] = S; $('#cmp').value = ''; autosize(); render(true); toast('Demo data reset.'); }
      break;
    case 'toggle-sidebar': toggleSidebar(); break;
    case 'proj-menu': projMenu = !projMenu; menuOpen = false; renderSidebar(); if (projMenu){ const f = document.querySelector('.pmenu [role="menuitem"]'); if (f) f.focus(); } break;
    case 'switch-project': switchProject(el.dataset.id); break;
    case 'new-project': navOpen = false; S.sheet = null; S.modal = {type:'new', step:1, name:'', files:[], error:''}; render(); break;
    case 'new-back': S.modal.step = 1; S.modal.error = ''; renderLayer(); break;
    case 'new-remove-file': S.modal.files.splice(+el.dataset.i, 1); renderLayer(); break;
    case 'create-project': createProject(S.modal); break;
    case 'start-run': startRun(); break;
    case 'open-project': navOpen = false; S.sheet = null; S.modal = {type:'project'}; render(); break;
  }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file-in'){
    const f = t.files && t.files[0]; if (!f) return;
    if (!/\.(txt|md|markdown)$/i.test(f.name)){ S.modal.error = 'Only .txt and .md files are supported in this version.'; renderLayer(); return; }
    if (f.size > FILE_LIMIT){ S.modal.error = 'This file is larger than 512 KB. Split it or trim it first.'; renderLayer(); return; }
    const r = new FileReader();
    r.onload = () => { const paras = String(r.result).split(/\r?\n\s*\r?\n/).map(p => p.replace(/\s+/g,' ').trim()).filter(Boolean); if (!paras.length){ S.modal.error = 'This file is empty.'; renderLayer(); return; } const err = addSource(f.name, paras, null); if (err){ S.modal = {type:'add', error:err}; renderLayer(); } };
    r.onerror = () => { S.modal.error = 'The file couldn’t be read. Try saving it as plain text.'; renderLayer(); };
    r.readAsText(f);
  }
  if (t.id === 'new-files'){
    const files = Array.from(t.files || []); if (!files.length) return;
    const m = S.modal; m.error = '';
    Promise.all(files.map(f => new Promise(res => {
      if (!/\.(txt|md|markdown)$/i.test(f.name)) return res({err:f.name + ' isn’t a .txt or .md file.'});
      if (f.size > FILE_LIMIT) return res({err:f.name + ' is larger than 512 KB.'});
      const r = new FileReader();
      r.onload = () => { const paras = String(r.result).split(/\r?\n\s*\r?\n/).map(p => p.replace(/\s+/g,' ').trim()).filter(Boolean); res(paras.length ? {name:f.name, paras, words:paras.reduce((n,p)=>n+countWords(p),0)} : {err:f.name + ' is empty.'}); };
      r.onerror = () => res({err:f.name + ' couldn’t be read.'});
      r.readAsText(f);
    }))).then(results => {
      const errs = [];
      results.forEach(x => {
        if (x.err){ errs.push(x.err); return; }
        const total = m.files.reduce((n, f) => n + f.words, 0);
        if (total + x.words > WORD_LIMIT){ errs.push(x.name + ' would go over the 6,000-word limit.'); return; }
        m.files.push(x);
      });
      m.error = errs.join(' ');
      if (S.modal === m) renderLayer();
    });
  }
  if (t.id === 'pf-photo'){
    const f = t.files && t.files[0]; if (!f) return; syncProfile();
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)){ S.modal.error = 'Choose a JPG, PNG or WebP image.'; renderLayer(); return; }
    if (f.size > 2 * 1024 * 1024){ S.modal.error = 'That image is larger than 2 MB. Choose a smaller one.'; renderLayer(); return; }
    const r = new FileReader(); r.onload = () => { S.modal.draft.photo = String(r.result); S.modal.error = ''; renderLayer(); }; r.readAsDataURL(f);
  }
  if (t.name === 'pref-theme'){ prefs.theme = t.value; applyPrefs(); savePrefs(); }
  if (t.name === 'pref-accent'){ prefs.accent = t.value; applyPrefs(); savePrefs(); }
  if (t.id === 'ex-ver'){ S.modal.v = +t.value; renderLayer(); }
  if (t.id === 'ver-sel'){ S.viewV = t.value === 'live' ? null : +t.value; if (S.viewV && cur() && S.viewV === cur().v && !S.draft && !S.candidate) S.viewV = null; S.open = {}; S.filter = 'all'; renderPage(); }
  if (t.id === 'cmp-a' || t.id === 'cmp-b'){ S[t.id === 'cmp-a' ? 'cmpA' : 'cmpB'] = +t.value; renderPage(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pf-bio'){ const c = $('#pf-bio-count'); if (c) c.textContent = e.target.value.length; }
  if (e.target.id === 'cmp'){ autosize(); updateCount(); }
});
let rsz = null;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (user){ renderSidebar(); renderTopbar(); } }, 120); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (projMenu){ projMenu = false; renderSidebar(); const b = $('.sb-project'); if (b) b.focus(); return; }
    if (menuOpen){ menuOpen = false; renderSidebar(); const b = $('.user-btn'); if (b) b.focus(); return; }
    if (runPop){ runPop = false; renderTopbar(); return; }
    if (S && (S.modal || S.sheet)){ if (S.modal) S.modal = null; else S.sheet = null; resetArmed = false; renderLayer(); return; }
    if (navOpen){ navOpen = false; renderSidebar(); return; }
  }
  if (e.target.id === 'cmp' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMessage(); }
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'composer'){ e.preventDefault(); sendMessage(); return; }
  if (id === 'login-form'){ e.preventDefault(); signIn(); return; }
  if (id === 'name-form'){ e.preventDefault(); if (setProjectName($('#proj-name').value, '#proj-name', '#name-err')){ render(true); setTimeout(() => $('#cmp').focus(), 0); } return; }
  if (id === 'new-form'){
    e.preventDefault();
    const v = $('#np-name').value.trim().replace(/\s+/g, ' ');
    if (!v){ $('#np-err').textContent = 'Enter a project name.'; $('#np-name').focus(); return; }
    S.modal.name = v; S.modal.step = 2; S.modal.error = ''; renderLayer(); return;
  }
  if (id === 'proj-form'){ e.preventDefault(); if (!can('edit')) return; if (setProjectName($('#ps-name').value, '#ps-name', '#ps-err')){ S.modal = null; resetArmed = false; render(); toast('Project settings saved.'); } return; }
  if (id === 'person-form'){
    e.preventDefault(); if (!can('edit')) return;
    const p = S.stakeholders.find(x => x.id === e.target.dataset.id);
    const name = $('#pe-name').value.trim().replace(/\s+/g, ' '), role = $('#pe-role').value.trim().replace(/\s+/g, ' ');
    if (!name || !role){ $('#pe-err').textContent = 'Enter both a name and a role.'; (name ? $('#pe-role') : $('#pe-name')).focus(); return; }
    if (name !== p.name || role !== p.role){
      if (!p.aiName){ p.aiName = p.name; p.aiRole = p.role; }
      log('You', 'Corrected a person in sources: ' + p.name + ', ' + p.role + ' → ' + name + ', ' + role);
      p.name = name; p.role = role; p.editedBy = user.name;
      if (p.aiName === name && p.aiRole === role){ p.aiName = null; p.aiRole = null; p.editedBy = null; }
    }
    S.editPerson = null; render();
  }
});

/* ---------- boot ---------- */
try { const p = JSON.parse(localStorage.getItem('scopesteps-prefs') || 'null'); if (p && ['light','dark','system'].indexOf(p.theme) > -1) prefs.theme = p.theme; if (p && ['indigo','teal'].indexOf(p.accent) > -1) prefs.accent = p.accent; if (p) prefs.sbCollapsed = !!p.sbCollapsed; } catch(_) {}
applyPrefs();
loadProfiles();
store = loadSaved() || newStore();
S = store.projects[store.current];
render(true);
})();
</script>
