# Alert rules for agent runs and model calls (ADR 0023), evaluated by the Prometheus in the local
# telemetry backend (`just telemetry`). Each threshold comes from a recorded evaluation: the
# `source` annotation names the evals/README.md section and report stamp, and the thresholds are
# reviewed whenever a prompt is adopted. Tests: alerts.test.yaml (`just alerts-check`).
#
# Every rule leaves replays out (`scopesteps_replay`, `gen_ai_provider_name`), sums over API
# processes, and needs a minimum number of finished runs in its window before it can fire, because
# POC traffic is low and one bad run in three would otherwise page.
groups:
  - name: scopesteps-agent
    rules:
      - alert: AgentRunFailureRateHigh
        expr: |
          (
            sum(increase(scopesteps_agent_runs_total{scopesteps_replay="false", scopesteps_run_status="failed"}[1h]))
            / sum(increase(scopesteps_agent_runs_total{scopesteps_replay="false"}[1h]))
          ) > 0.10
          and on ()
          sum(increase(scopesteps_agent_runs_total{scopesteps_replay="false"}[1h])) >= 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 10% of agent runs failed in the last hour
          threshold: 'failed runs above 10% of finished runs'
          window: '1h'
          min_runs: '10 finished runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft 1/48 failed, 95% interval up to 11% (report 20261026T034928Z); change 0/24 (20261024T000733Z); reply 0/54 (20261019T214450Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunfailureratehigh'

      - alert: ModelCallLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name!="replay"}[15m]))
          ) > 25
          and on ()
          sum(increase(scopesteps_agent_runs_total{scopesteps_replay="false"}[15m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Model calls are slow (p95 above 25 s over 15 minutes)
          threshold: 'p95 model-call duration above 25 s'
          window: '15m'
          min_runs: '5 finished runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 p95 16.4 s over 92 calls (report 20261026T034928Z); calls time out at 30 s (MODEL_TIMEOUT_SECONDS)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelcalllatencyhigh'

      - alert: ModelCallsCutOff
        expr: |
          (
            sum(increase(gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name!="replay", scopesteps_finish_reason="max_tokens"}[1h]))
            / sum(increase(gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name!="replay"}[1h]))
          ) > 0.12
          and on ()
          sum(increase(scopesteps_agent_runs_total{scopesteps_replay="false"}[1h])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 12% of model calls were cut off by the output limit
          threshold: 'calls cut off by the output limit above 12% of calls'
          window: '1h'
          min_runs: '10 finished runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 5/92 calls cut off, 95% interval up to 12% (report 20261026T034928Z); change 0/76 (20261024T000733Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelcallscutoff'

      - alert: AgentRunCostHigh
        expr: |
          (
            sum(increase(scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h]))
            / sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h]))
          ) > 0.047
          and on ()
          sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h])) >= 10
        for: 5m
        labels:
          severity: warning
          scopesteps_run_kind: draft
        annotations:
          summary: Draft runs cost more than twice the evaluation mean
          threshold: 'mean estimated cost per draft run above $0.047 (2 x $0.0234)'
          window: '6h'
          min_runs: '10 finished draft runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 mean $0.0234 per draft over 48 drafts (report 20261026T034928Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'

      - alert: AgentRunCostHigh
        expr: |
          (
            sum(increase(scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false", scopesteps_run_kind="change"}[6h]))
            / sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="change"}[6h]))
          ) > 0.014
          and on ()
          sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="change"}[6h])) >= 10
        for: 5m
        labels:
          severity: warning
          scopesteps_run_kind: change
        annotations:
          summary: Change runs cost more than twice the evaluation mean
          threshold: 'mean estimated cost per change run above $0.014 (2 x $0.0071)'
          window: '6h'
          min_runs: '10 finished change runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): change-v7 mean $0.0071 per run over 24 runs (report 20261024T000733Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'

      - alert: AgentRunCostHigh
        expr: |
          (
            sum(increase(scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false", scopesteps_run_kind="reply"}[6h]))
            / sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="reply"}[6h]))
          ) > 0.0026
          and on ()
          sum(increase(scopesteps_agent_run_cost_USD_count{scopesteps_replay="false", scopesteps_run_kind="reply"}[6h])) >= 10
        for: 5m
        labels:
          severity: warning
          scopesteps_run_kind: reply
        annotations:
          summary: Replies cost more than twice the evaluation mean
          threshold: 'mean estimated cost per reply above $0.0026 (2 x $0.0013)'
          window: '6h'
          min_runs: '10 finished replies in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): reply-v4 mean $0.0013 per reply over 54 replies (report 20261019T214450Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'

      - alert: AgentRunProblemsHigh
        expr: |
          (
            sum(increase(scopesteps_agent_run_problems_sum{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h]))
            / sum(increase(scopesteps_agent_run_problems_count{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h]))
          ) > 5.7
          and on ()
          sum(increase(scopesteps_agent_run_problems_count{scopesteps_replay="false", scopesteps_run_kind="draft"}[6h])) >= 10
        for: 5m
        labels:
          severity: warning
          scopesteps_run_kind: draft
        annotations:
          summary: Drafts leave more check problems after repair than in evaluation
          threshold: 'mean problems left after repair above 5.7 per draft run'
          window: '6h'
          min_runs: '10 finished draft runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 mean 5.71 problems left per draft over 48 drafts (report 20261026T034928Z)'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunproblemshigh'

      - alert: AgentRunProblemsHigh
        expr: |
          (
            sum(increase(scopesteps_agent_run_problems_sum{scopesteps_replay="false", scopesteps_run_kind="change"}[6h]))
            / sum(increase(scopesteps_agent_run_problems_count{scopesteps_replay="false", scopesteps_run_kind="change"}[6h]))
          ) > 0.5
          and on ()
          sum(increase(scopesteps_agent_run_problems_count{scopesteps_replay="false", scopesteps_run_kind="change"}[6h])) >= 10
        for: 5m
        labels:
          severity: warning
          scopesteps_run_kind: change
        annotations:
          summary: Change sets leave more check problems after repair than in evaluation
          threshold: 'mean problems left after repair above 0.5 per change run'
          window: '6h'
          min_runs: '10 finished change runs in the window'
          source: 'evals/README.md, "Alert thresholds" (2026-11-03): change-v7 left no problems in 24 runs (report 20261024T000733Z); 0.5 so one problem alone cannot fire'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunproblemshigh'

      - alert: BackupCircuitOpened
        expr: sum(increase(scopesteps_agent_circuit_openings_total[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: The primary model's circuit opened; new runs use the backup provider
          threshold: 'any opening'
          window: '15m'
          min_runs: "none beyond the breaker's own: it opens only after 3 primary availability failures within 2 minutes"
          source: 'ADR 0006 (backup provider) and the breaker defaults in application/fallback.py; no evaluation measures it, because evaluations never fall back'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#backupcircuitopened'

  # Jira publishing (ADR 0029). The API exports how long the oldest publish still sending has been
  # at it, read from the publish table, so the max over API processes is the one to watch.
  - name: scopesteps-jira
    rules:
      - alert: JiraPublishStuck
        expr: max(scopesteps_jira_publish_oldest_sending_age_seconds) > 1800
        labels:
          severity: warning
        annotations:
          summary: A Jira publish has been sending for more than 30 minutes
          threshold: 'oldest publish still sending older than 30 minutes'
          window: 'none: the age is the duration'
          min_runs: 'none: one stuck publish is enough'
          source: 'ADR 0029: a publish normally ends within a minute, and the background sender waits at most 15 minutes between attempts, so 30 minutes is two waits without an end'
          runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/jira-alerts.md#jirapublishstuck'
