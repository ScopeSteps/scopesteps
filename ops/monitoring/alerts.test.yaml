# Unit tests for alerts.yaml, run by `just alerts-check` and CI with promtool (ADR 0023). Each rule
# is shown firing when synthetic run outcomes pass its threshold, quiet below it, and quiet with
# fewer runs than its minimum. Series are 0 until minute 9; the runs finish at minute 10.
# The expected annotations repeat the rules' own, so a changed threshold or source must be
# changed here too.
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  # Failure rate: 3 of 20 runs failed (15%) fires; it waits out its 5 minutes first.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 17+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="failed"}'
        values: '0+0x9 3+0x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: AgentRunFailureRateHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: AgentRunFailureRateHigh
        exp_alerts:
          - exp_labels: { 'severity': 'critical' }
            exp_annotations: &agentrunfailureratehigh
              summary: 'More than 10% of agent runs failed in the last hour'
              threshold: 'failed runs above 10% of finished runs'
              window: '1h'
              min_runs: '10 finished runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft 1/48 failed, 95% interval up to 11% (report 20261026T034928Z); change 0/24 (20261024T000733Z); reply 0/54 (20261019T214450Z)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunfailureratehigh'

  # Failure rate: 1 of 20 runs failed (5%) stays quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 19+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="failed"}'
        values: '0+0x9 1+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunFailureRateHigh
        exp_alerts: []

  # Failure rate: 3 of 6 runs failed (50%) stays quiet below the 10-run minimum.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 3+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="failed"}'
        values: '0+0x9 3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunFailureRateHigh
        exp_alerts: []

  # Failure rate: failed replays are left out.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="true",scopesteps_run_status="failed"}'
        values: '0+0x9 20+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunFailureRateHigh
        exp_alerts: []

  # Latency: replies between 20 and 41 s (p95 about 40 s, above 30 s) fire for the reply step;
  # outline calls just as slow stay under the outline's 210 s.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="40.96"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="40.96"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: ModelCallLatencyHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: ModelCallLatencyHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_step': 'reply' }
            exp_annotations:
              summary: 'Model calls for step reply are slow (p95 above half the step timeout over 15 minutes)'
              threshold: 'p95 model-call duration above half the step timeout: outline 210 s, change 120 s, explore and change_explore 90 s, epic_stories and suggest_tasks 60 s, reply 30 s'
              window: '15m'
              min_runs: '5 finished runs in the window'
              source: 'ADR 0032, the claude-mix-v1 step timeouts (provisional): no Claude evaluation has measured latency yet'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelcalllatencyhigh'

  # Latency: outline calls between 164 and 328 s (p95 about 320 s) fire for the outline step;
  # change calls between 41 and 82 s stay under the change's 120 s.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="40.96"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="81.92"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="163.84"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="outline",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="40.96"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="change",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ModelCallLatencyHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_step': 'outline' }
            exp_annotations:
              summary: 'Model calls for step outline are slow (p95 above half the step timeout over 15 minutes)'
              threshold: 'p95 model-call duration above half the step timeout: outline 210 s, change 120 s, explore and change_explore 90 s, epic_stories and suggest_tasks 60 s, reply 30 s'
              window: '15m'
              min_runs: '5 finished runs in the window'
              source: 'ADR 0032, the claude-mix-v1 step timeouts (provisional): no Claude evaluation has measured latency yet'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelcalllatencyhigh'

  # Latency: explore calls between 41 and 82 s (p95 about 80 s) stay under 90 s.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="40.96"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="explore",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ModelCallLatencyHigh
        exp_alerts: []

  # Latency: slow replies from 3 runs stay quiet below the 5-run minimum.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="40.96"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="anthropic",scopesteps_step="reply",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 3+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ModelCallLatencyHigh
        exp_alerts: []

  # Latency: slow replayed calls are left out.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="20.48"}'
        values: '0+0x9 0+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="40.96"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="81.92"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="163.84"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="327.68"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="655.36"}'
        values: '0+0x9 20+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_bucket{gen_ai_provider_name="replay",scopesteps_step="reply",le="+Inf"}'
        values: '0+0x9 20+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ModelCallLatencyHigh
        exp_alerts: []

  # Cut off: 3 of 20 calls stopped at the output limit (15%) fires.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="completed"}'
        values: '0+0x9 17+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="max_tokens"}'
        values: '0+0x9 3+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ModelCallsCutOff
        exp_alerts:
          - exp_labels: { 'severity': 'warning' }
            exp_annotations: &modelcallscutoff
              summary: 'More than 12% of model calls were cut off by the output limit'
              threshold: 'calls cut off by the output limit above 12% of calls'
              window: '1h'
              min_runs: '10 finished runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 5/92 calls cut off, 95% interval up to 12% (report 20261026T034928Z); change 0/76 (20261024T000733Z)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelcallscutoff'

  # Cut off: 2 of 20 calls (10%) stays quiet.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="completed"}'
        values: '0+0x9 18+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="max_tokens"}'
        values: '0+0x9 2+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 10+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ModelCallsCutOff
        exp_alerts: []

  # Cut off: 3 of 6 calls stays quiet below the 10-run minimum.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="completed"}'
        values: '0+0x9 3+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_finish_reason="max_tokens"}'
        values: '0+0x9 3+0x60'
      - series: 'scopesteps_agent_runs_total{scopesteps_replay="false",scopesteps_run_status="completed"}'
        values: '0+0x9 3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: ModelCallsCutOff
        exp_alerts: []

  # Cost: 10 drafts at $0.30 each fire; replayed change runs at the same cost do not.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 3+0x60'
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="true",scopesteps_run_kind="change"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="true",scopesteps_run_kind="change"}'
        values: '0+0x9 3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunCostHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_run_kind': 'draft' }
            exp_annotations: &agentruncosthigh_draft
              summary: 'Draft runs cost more than twice the estimated mean'
              threshold: 'mean estimated cost per draft run above $0.21 (2 x $0.104, provisional)'
              window: '6h'
              min_runs: '10 finished draft runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-15): draft-v10 tokens from report 20261026T034928Z re-priced at Claude Sonnet 5.5 rates, mean $0.104 per draft over 48 drafts (provisional, ADR 0032)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'

  # Cost: 10 drafts at $0.15 each stay quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 1.5+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunCostHigh
        exp_alerts: []

  # Cost: 4 drafts at $0.40 each stay quiet below the 10-run minimum.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 4+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 1.6+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunCostHigh
        exp_alerts: []

  # Cost: change runs at $0.10 and replies at $0.002 each fire under their own thresholds.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 1+0x60'
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="reply"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="reply"}'
        values: '0+0x9 0.02+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunCostHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_run_kind': 'change' }
            exp_annotations: &agentruncosthigh_change
              summary: 'Change runs cost more than twice the estimated mean'
              threshold: 'mean estimated cost per change run above $0.077 (2 x $0.0384, provisional)'
              window: '6h'
              min_runs: '10 finished change runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-15): change-v7 tokens from report 20261024T000733Z re-priced at Claude Sonnet 5.5 rates, mean $0.0384 per run over 24 runs (provisional, ADR 0032)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'
          - exp_labels: { 'severity': 'warning', 'scopesteps_run_kind': 'reply' }
            exp_annotations: &agentruncosthigh_reply
              summary: 'Replies cost more than twice the estimated mean'
              threshold: 'mean estimated cost per reply above $0.0008 (2 x $0.0004, provisional)'
              window: '6h'
              min_runs: '10 finished replies in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-15): reply-v4 tokens from report 20261019T214450Z re-priced at Claude Haiku 5.5 rates, mean $0.0004 per reply over 54 replies (provisional, ADR 0032)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentruncosthigh'

  # Cost: change runs at $0.05 and replies at $0.0005 each stay quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 0.5+0x60'
      - series: 'scopesteps_agent_run_cost_USD_count{scopesteps_replay="false",scopesteps_run_kind="reply"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_cost_USD_sum{scopesteps_replay="false",scopesteps_run_kind="reply"}'
        values: '0+0x9 0.005+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunCostHigh
        exp_alerts: []

  # Problems: 10 drafts leaving 8 each fire.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_problems_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_problems_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 80+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunProblemsHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_run_kind': 'draft' }
            exp_annotations: &agentrunproblemshigh_draft
              summary: 'Drafts leave more check problems after repair than in evaluation'
              threshold: 'mean problems left after repair above 5.7 per draft run'
              window: '6h'
              min_runs: '10 finished draft runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-03): draft-v10 mean 5.71 problems left per draft over 48 drafts (report 20261026T034928Z)'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunproblemshigh'

  # Problems: 10 drafts leaving 3 each stay quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_problems_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_problems_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 30+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunProblemsHigh
        exp_alerts: []

  # Problems: 5 drafts leaving 10 each stay quiet below the 10-run minimum.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_problems_count{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 5+0x60'
      - series: 'scopesteps_agent_run_problems_sum{scopesteps_replay="false",scopesteps_run_kind="draft"}'
        values: '0+0x9 50+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunProblemsHigh
        exp_alerts: []

  # Problems: 6 problems over 10 change runs fire; 1 over 10 would not.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_problems_count{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_problems_sum{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 6+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunProblemsHigh
        exp_alerts:
          - exp_labels: { 'severity': 'warning', 'scopesteps_run_kind': 'change' }
            exp_annotations: &agentrunproblemshigh_change
              summary: 'Change sets leave more check problems after repair than in evaluation'
              threshold: 'mean problems left after repair above 0.5 per change run'
              window: '6h'
              min_runs: '10 finished change runs in the window'
              source: 'evals/README.md, "Alert thresholds" (2026-11-03): change-v7 left no problems in 24 runs (report 20261024T000733Z); 0.5 so one problem alone cannot fire'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#agentrunproblemshigh'

  # Problems: 1 problem over 10 change runs stays quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_agent_run_problems_count{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 10+0x60'
      - series: 'scopesteps_agent_run_problems_sum{scopesteps_replay="false",scopesteps_run_kind="change"}'
        values: '0+0x9 1+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunProblemsHigh
        exp_alerts: []

  # Spend limit: one call refused for the spend limit fires at once and clears 15 minutes later.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_step="outline",error_type="spend_limit"}'
        values: '0+0x9 1+0x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: ModelSpendLimitReached
        exp_alerts:
          - exp_labels: { 'severity': 'critical' }
            exp_annotations:
              summary: 'The Claude account reached its spend limit; every model call fails until it is raised'
              threshold: 'any model call refused for the spend limit'
              window: '15m'
              min_runs: 'none: one refused call means every later call fails too'
              source: 'ADR 0032: a spend limit reached at the provider (spend_limit) fails the run and is never retried'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/agent-alerts.md#modelspendlimitreached'
      - eval_time: 40m
        alertname: ModelSpendLimitReached
        exp_alerts: []

  # Spend limit: other errors (rate limits, overload) stay quiet.
  - interval: 1m
    input_series:
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_step="outline",error_type="quota"}'
        values: '0+0x9 5+0x60'
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_provider_name="anthropic",scopesteps_step="outline",error_type="unavailable"}'
        values: '0+0x9 5+0x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: ModelSpendLimitReached
        exp_alerts: []

  # Jira: a publish sending since minute 0 passes 30 minutes at minute 31 and fires; a second API
  # process reporting a younger one does not change that, and it clears when the publish ends.
  - interval: 1m
    input_series:
      - series: 'scopesteps_jira_publish_oldest_sending_age_seconds{service_instance_id="api-1"}'
        values: '0+60x40 0+0x20'
      - series: 'scopesteps_jira_publish_oldest_sending_age_seconds{service_instance_id="api-2"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: JiraPublishStuck
        exp_alerts: []
      - eval_time: 35m
        alertname: JiraPublishStuck
        exp_alerts:
          - exp_labels: { 'severity': 'warning' }
            exp_annotations:
              summary: 'A Jira publish has been sending for more than 30 minutes'
              threshold: 'oldest publish still sending older than 30 minutes'
              window: 'none: the age is the duration'
              min_runs: 'none: one stuck publish is enough'
              source: 'ADR 0029: a publish normally ends within a minute, and the background sender waits at most 15 minutes between attempts, so 30 minutes is two waits without an end'
              runbook_url: 'https://github.com/ScopeSteps/scopesteps/blob/main/docs/runbooks/jira-alerts.md#jirapublishstuck'
      - eval_time: 50m
        alertname: JiraPublishStuck
        exp_alerts: []

  # Jira: publishes that keep finishing in minutes stay quiet.
  - interval: 1m
    input_series:
      - series: 'scopesteps_jira_publish_oldest_sending_age_seconds{service_instance_id="api-1"}'
        values: '0 60 120 0 60 0 0 60 120 180 0+0x50'
    alert_rule_test:
      - eval_time: 30m
        alertname: JiraPublishStuck
        exp_alerts: []
