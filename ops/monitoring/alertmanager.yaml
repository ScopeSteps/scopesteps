# Local Alertmanager for the agent's alerts (ADR 0023). Every alert goes to one receiver that
# emails the local test inbox (Mailpit, http://localhost:8025), so nothing leaves the laptop.
# To add a real channel later, add a receiver here and route to it: see
# docs/runbooks/agent-alerts.md, "Adding a notification channel".
global:
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alerts@scopesteps.localhost'
  # Mailpit speaks plain SMTP on the compose network.
  smtp_require_tls: false

route:
  receiver: local-inbox
  group_by: ['alertname', 'scopesteps_run_kind']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-inbox
    email_configs:
      - to: 'maintainers@scopesteps.localhost'
        send_resolved: true
