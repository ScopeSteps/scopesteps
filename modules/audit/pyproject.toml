[project]
name = "scopesteps-audit"
version = "0.1.0"
description = "Append-only audit events for business actions."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "scopesteps-identity",
    "scopesteps-infrastructure",
    "scopesteps-kernel",
    "scopesteps-projects",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.audit"

[tool.uv.sources]
scopesteps-identity = { workspace = true }
scopesteps-infrastructure = { workspace = true }
scopesteps-projects = { workspace = true }
