[project]
name = "scopesteps-projects"
version = "0.1.0"
description = "Projects, goals, stakeholder profiles and decision rights."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "scopesteps-infrastructure",
    "scopesteps-kernel",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.projects"

[tool.uv.sources]
scopesteps-infrastructure = { workspace = true }
