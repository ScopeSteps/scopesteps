[project]
name = "scopesteps-projects"
version = "0.1.0"
description = "Projects, goals, stakeholder profiles and decision rights."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "scopesteps-audit",
    "scopesteps-backlog",
    "scopesteps-evidence",
    "scopesteps-identity",
    "scopesteps-infrastructure",
    "scopesteps-kernel",
    "scopesteps-sources",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.projects"

[tool.uv.sources]
scopesteps-audit = { workspace = true }
scopesteps-backlog = { workspace = true }
scopesteps-evidence = { workspace = true }
scopesteps-identity = { workspace = true }
scopesteps-infrastructure = { workspace = true }
scopesteps-sources = { workspace = true }
