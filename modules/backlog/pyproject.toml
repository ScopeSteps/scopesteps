[project]
name = "scopesteps-backlog"
version = "0.1.0"
description = "Requirements, epics, stories, acceptance criteria, dependencies and backlog versions."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "scopesteps-evidence",
    "scopesteps-identity",
    "scopesteps-infrastructure",
    "scopesteps-kernel",
    "scopesteps-projects",
    "scopesteps-sources",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.backlog"

[tool.uv.sources]
scopesteps-infrastructure = { workspace = true }
scopesteps-evidence = { workspace = true }
scopesteps-projects = { workspace = true }
scopesteps-identity = { workspace = true }
scopesteps-sources = { workspace = true }
