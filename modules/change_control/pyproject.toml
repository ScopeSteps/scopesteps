[project]
name = "scopesteps-change-control"
version = "0.1.0"
description = "Approved baselines, change requests, scope diffs, approvals and rejections."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "scopesteps-kernel",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.change_control"
