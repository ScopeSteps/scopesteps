[project]
name = "scopesteps-infrastructure"
version = "0.1.0"
description = "Shared technical building blocks: database base classes and engine, HTTP dependencies."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.infrastructure"
