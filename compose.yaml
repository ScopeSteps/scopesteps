name: scopesteps

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: scopesteps
      POSTGRES_PASSWORD: scopesteps
      POSTGRES_DB: scopesteps
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scopesteps']
      interval: 2s
      timeout: 5s
      retries: 15

  # Local test inbox: the API's emails land here in development, never in real mailboxes.
  # SMTP on 1025, the inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
