name: scopesteps

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: scopesteps
      POSTGRES_PASSWORD: scopesteps
      POSTGRES_DB: scopesteps
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scopesteps']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
