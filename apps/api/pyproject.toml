[project]
name = "scopesteps-api"
version = "0.1.0"
description = "ScopeSteps HTTP API: composes the enabled modules into one FastAPI application."
requires-python = ">=3.14"
dependencies = [
  "scopesteps-kernel",
  "scopesteps-identity",
  "scopesteps-projects",
  "scopesteps-sources",
  "scopesteps-evidence",
  "scopesteps-backlog",
  "scopesteps-change-control",
  "scopesteps-agent",
  "scopesteps-audit",
  "scopesteps-discussions",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "pydantic-settings>=2.15.0",
  "sqlalchemy>=2.1.3",
  "psycopg[binary]>=3.3.6",
  "scopesteps-infrastructure",
  "alembic>=1.20.0",
]

[project.scripts]
scopesteps-api = "scopesteps.api.__main__:main"
scopesteps-seed = "scopesteps.api.seed:main"
scopesteps-probe-model = "scopesteps.api.probe_model:main"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scopesteps.api"

[tool.uv.sources]
scopesteps-infrastructure = { workspace = true }
