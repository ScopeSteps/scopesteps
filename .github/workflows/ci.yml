name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Module boundaries
        run: uv run lint-imports
      - name: Test
        run: uv run pytest

  postgres:
    name: Postgres migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scopesteps
          POSTGRES_PASSWORD: scopesteps
          POSTGRES_DB: scopesteps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopesteps"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://scopesteps:scopesteps@127.0.0.1:5432/scopesteps
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Upgrade and seed
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run scopesteps-seed
          uv run scopesteps-seed
      - name: Downgrade and upgrade again
        run: |
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Models match migrations
        run: uv run alembic -c apps/api/alembic.ini check

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @scopesteps/web lint
      - name: Format
        run: pnpm exec prettier --check .
      - name: Type-check
        run: pnpm --filter @scopesteps/web typecheck
      - name: Test
        run: pnpm --filter @scopesteps/web test
      - name: Build
        run: pnpm --filter @scopesteps/web build

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - name: Regenerate contract and client
        run: |
          uv run python scripts/export_openapi.py
          pnpm --filter @scopesteps/api-client generate
          pnpm exec prettier --write contracts packages/api-client/src
      - name: Fail if out of date
        run: |
          git diff --exit-code -- contracts packages/api-client/src \
            || (echo "::error::Contract is stale. Run 'just contract' and commit the result." && exit 1)
