name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary, not gitleaks-action: the action needs a paid licence for organisation repos.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Module boundaries
        run: uv run lint-imports
      - name: Test
        run: uv run pytest

  postgres:
    name: Postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scopesteps
          POSTGRES_PASSWORD: scopesteps
          POSTGRES_DB: scopesteps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopesteps"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://scopesteps:scopesteps@127.0.0.1:5432/scopesteps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Upgrade and seed
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run scopesteps-seed
          uv run scopesteps-seed
      - name: Downgrade and upgrade again
        run: |
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Models match migrations
        run: uv run alembic -c apps/api/alembic.ini check

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @scopesteps/web lint
      - name: Format
        run: pnpm exec prettier --check .
      - name: Type-check
        run: pnpm --filter @scopesteps/web typecheck
      - name: Test
        run: pnpm --filter @scopesteps/web test
      - name: Build
        run: pnpm --filter @scopesteps/web build

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: uv sync --all-packages --locked
      - run: pnpm install --frozen-lockfile
      - name: Regenerate contract and client
        run: |
          uv run python scripts/export_openapi.py
          pnpm --filter @scopesteps/api-client generate
          pnpm exec prettier --write contracts packages/api-client/src
      - name: Fail if out of date
        run: |
          git diff --exit-code -- contracts packages/api-client/src \
            || (echo "::error::Contract is stale. Run 'just contract' and commit the result." && exit 1)
