name: Feature request
description: Suggest a change to what ScopeSteps does.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like. Sketches and examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
