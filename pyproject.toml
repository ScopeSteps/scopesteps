protected_modules = ["scopesteps.backlog.domain", "scopesteps.backlog.application", "scopesteps.backlog.infrastructure", "scopesteps.backlog.http"]
allowed_importers = ["scopesteps.backlog", "scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Only change_control and the API composition root import change_control internals"
