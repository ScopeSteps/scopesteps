[project]
name = "scopesteps-workspace"
version = "0.0.0"
description = "Workspace root for the ScopeSteps Python packages. Not published."
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false
# Only resolve releases at least a week old (Technical Proposal, section 1).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api", "packages/kernel", "packages/infrastructure", "modules/*", "evals"]
# Reserved for later phases; they become members once they have a pyproject.toml.
exclude = ["modules/jira_integration", "modules/planning"]

[tool.uv.sources]
scopesteps-kernel = { workspace = true }
scopesteps-infrastructure = { workspace = true }
scopesteps-identity = { workspace = true }
scopesteps-projects = { workspace = true }
scopesteps-sources = { workspace = true }
scopesteps-evidence = { workspace = true }
scopesteps-backlog = { workspace = true }
scopesteps-change-control = { workspace = true }
scopesteps-agent = { workspace = true }
scopesteps-audit = { workspace = true }
scopesteps-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["apps/*/src", "packages/*/src", "modules/*/src", "evals/src"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "S", "ASYNC", "PT", "RUF", "TID", "ERA", "DTZ", "FAST",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["apps", "packages", "modules", "evals", "scripts"]
exclude = ["**/node_modules", "**/.venv", "apps/web"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
testpaths = ["apps/api/tests", "packages", "modules", "evals"]

[tool.importlinter]
root_packages = ["scopesteps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each module is layered: http -> infrastructure -> application -> domain"
type = "layers"
containers = ["scopesteps.identity", "scopesteps.projects", "scopesteps.sources", "scopesteps.evidence", "scopesteps.backlog", "scopesteps.change_control", "scopesteps.agent", "scopesteps.audit"]
layers = ["http", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Domain code and the kernel are framework-free"
type = "forbidden"
source_modules = ["scopesteps.identity.domain", "scopesteps.projects.domain", "scopesteps.sources.domain", "scopesteps.evidence.domain", "scopesteps.backlog.domain", "scopesteps.change_control.domain", "scopesteps.agent.domain", "scopesteps.audit.domain", "scopesteps.kernel"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "scopesteps.infrastructure"]

[[tool.importlinter.contracts]]
name = "Modules and shared packages never import a deployable"
type = "forbidden"
source_modules = ["scopesteps.identity", "scopesteps.projects", "scopesteps.sources", "scopesteps.evidence", "scopesteps.backlog", "scopesteps.change_control", "scopesteps.agent", "scopesteps.audit", "scopesteps.kernel", "scopesteps.infrastructure"]
forbidden_modules = ["scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Product code never imports the evaluation tooling"
type = "forbidden"
source_modules = ["scopesteps.api", "scopesteps.identity", "scopesteps.projects", "scopesteps.sources", "scopesteps.evidence", "scopesteps.backlog", "scopesteps.change_control", "scopesteps.agent", "scopesteps.audit", "scopesteps.kernel", "scopesteps.infrastructure"]
forbidden_modules = ["scopesteps.evals"]

[[tool.importlinter.contracts]]
name = "Shared packages depend on no module"
type = "forbidden"
source_modules = ["scopesteps.kernel", "scopesteps.infrastructure"]
forbidden_modules = ["scopesteps.identity", "scopesteps.projects", "scopesteps.sources", "scopesteps.evidence", "scopesteps.backlog", "scopesteps.change_control", "scopesteps.agent", "scopesteps.audit"]

[[tool.importlinter.contracts]]
name = "Only identity and the API composition root import identity internals"
type = "protected"
protected_modules = ["scopesteps.identity.domain", "scopesteps.identity.application", "scopesteps.identity.infrastructure", "scopesteps.identity.http"]
allowed_importers = ["scopesteps.identity", "scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Only projects and the API composition root import projects internals"
type = "protected"
protected_modules = ["scopesteps.projects.domain", "scopesteps.projects.application", "scopesteps.projects.infrastructure", "scopesteps.projects.http"]
allowed_importers = ["scopesteps.projects", "scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Only sources and the API composition root import sources internals"
type = "protected"
protected_modules = ["scopesteps.sources.domain", "scopesteps.sources.application", "scopesteps.sources.infrastructure", "scopesteps.sources.http"]
allowed_importers = ["scopesteps.sources", "scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Only evidence and the API composition root import evidence internals"
type = "protected"
protected_modules = ["scopesteps.evidence.domain", "scopesteps.evidence.application", "scopesteps.evidence.infrastructure", "scopesteps.evidence.http"]
allowed_importers = ["scopesteps.evidence", "scopesteps.api"]

[[tool.importlinter.contracts]]
name = "Only backlog and the API composition root import backlog internals"
