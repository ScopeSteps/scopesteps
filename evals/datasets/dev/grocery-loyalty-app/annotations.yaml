          file: transcript.md,
          paragraph: 39,
          quote: 'From the store side, it has to be a scan at the till',
        }

  - name: Chloe Davies
    role: CRM manager
    evidence:
      - { file: transcript.md, paragraph: 66, quote: 'Digital receipts next.' }

  - name: Patrick Owens
    role: Data protection officer
    evidence:
      - { file: transcript.md, paragraph: 78, quote: "That's profiling." }

  - name: Maya Lin
    role: Delivery lead, Pixel and Co
    evidence:
      - { file: transcript.md, paragraph: 135, quote: 'Points expiry? Most schemes expire points' }

  - name: Ewan Fraser
    role: Finance business partner
    evidence:
      - { file: transcript-2-steering.md, paragraph: 15, quote: "So I've modelled both." }
