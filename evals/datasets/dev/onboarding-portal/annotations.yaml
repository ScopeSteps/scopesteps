# Answer key for a synthetic company project written to read like a real one: long Teams
# transcripts with side talk and confidential remarks, an early HR list and a security review.
# Paragraph numbers follow scopesteps.sources split_into_blocks: blocks separated by blank lines.
schema_version: 1
pack:
  id: onboarding-portal
  title: Welcome new starter portal
  difficulty: hard
  summary: >-
    An insurer's portal for new starters, from a brief, a discovery workshop, a design review two
    weeks later, HR's first requirements list and an IT security review. The design review
    settles most of what the workshop left open: sign-in, short-notice starters, diversity
    monitoring, adjustments and contractors. HR's list and the security review disagree on
    keeping identity document images, and legal has not answered; what happens to a withdrawn
    starter's data is also open. A welcome quiz is floated and turned into a progress bar. Both
    meetings carry holiday, kitchen and parking chat, a named starter's health condition, an
    unannounced resignation and gossip about executive pay. The change request asks to add
    probation reviews.

annotations:
  - id: CR-01
    kind: confirmed_requirement
    statement: >-
      Before day one the starter gives their personal details, an emergency contact and their bank
      and tax details in the portal.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 30,
          quote: 'the starter fills in their personal details, their emergency contact, their bank and tax details in the portal before day one',
        }

  - id: CR-02
    kind: confirmed_requirement
    statement: Bank and tax details go straight to payroll and are not stored in the portal.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 38,
          quote: "Bank and tax details go straight to payroll and aren't kept in the portal.",
        }
      - {
          file: supporting-security-review.md,
          paragraph: 6,
          quote: 'The portal passes bank and tax details to payroll and does not store them.',
        }

  - id: CR-03
    kind: confirmed_requirement
    statement: A change to bank or tax details after submitting goes straight to payroll too.
    expect: include
    evidence:
      - {
          file: transcript-2-design-review.md,
          paragraph: 42,
          quote: 'Any change goes straight to payroll the same way.',
        }

  - id: CR-04
    kind: confirmed_requirement
    statement: >-
      The starter uploads their right to work document before day one, and HR checks the original
      in person on the first day and records the check.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 54,
          quote: "HR still checks the original in person on their first day and records that it's done",
