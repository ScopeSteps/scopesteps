  # Change run
  - id: CI-01
    kind: expected_change_impact
    statement: >-
      The request reverses the exclusion of probation reviews (EX-02). The agent must ask the
      sponsor rather than add them silently.
    expect: ask
    relates_to: [EX-02]
    evidence:
      - {
          file: change_request.txt,
          paragraph: 2,
          quote: 'Please add three-month and six-month probation reviews to the portal.',
        }

