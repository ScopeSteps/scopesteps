      - { file: transcript.md, paragraph: 132, quote: 'Probation stays in the HR system as it is.' }

  - id: EX-03
    kind: exclusion
    statement: Contractors do not use the portal in the first release.
    expect: exclude
    evidence:
      - {
          file: transcript-2-design-review.md,
          paragraph: 95,
          quote: "Contractors aren't in the first release.",
