  - id: PR-01
    kind: proposal
    statement: A welcome quiz with badges is floated; only the progress bar is agreed.
    expect: not_commit
    evidence:
      - {
          file: transcript.md,
          paragraph: 71,
          quote: 'What if we turned the policies into a little welcome quiz?',
        }
      - { file: transcript.md, paragraph: 73, quote: "Let's not commit to the quiz for September." }

  - id: CF-01
    kind: conflict
    statement: >-
      HR's list keeps a copy of right to work documents for audit; the security review deletes the
      images thirty days after the check. Legal has not answered.
    expect: ask
    evidence:
      - {
          file: supporting-hr-requirements.md,
          paragraph: 5,
          quote: 'HR keeps a copy of the document in the portal for audit',
        }
      - {
          file: supporting-security-review.md,
          paragraph: 6,
          quote: 'Images of right to work documents are deleted from the portal 30 days after HR has checked the original.',
        }
      - {
          file: transcript-2-design-review.md,
          paragraph: 53,
          quote: "So that stays open, I'm afraid.",
        }

  - id: MD-01
    kind: missing_decision
    statement: How long a starter's information is kept when their offer is withdrawn is not decided.
    expect: ask
    evidence:
      - {
          file: transcript-2-design-review.md,
          paragraph: 133,
          quote: "How long we keep a starter's information when their offer is withdrawn.",
