  - id: CR-06
    kind: confirmed_requirement
    statement: The hiring manager gets a checklist for before and during the first week, with email reminders.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 89,
          quote: 'Okay, checklist and email reminders for the manager.',
