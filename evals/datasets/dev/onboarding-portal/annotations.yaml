  - id: OT-02
    kind: off_topic
    statement: The office move and parking permits are not about the project.
    expect: ignore
    evidence:
      - {
          file: transcript.md,
          paragraph: 140,
          quote: 'does anyone know if the office move is still happening in October?',
        }
      - {
          file: transcript-2-design-review.md,
          paragraph: 135,
          quote: 'Has anyone got a spare parking permit',
        }

  - id: SE-01
    kind: sensitive
    statement: A named starter's health condition is special category personal data.
    expect: ignore
