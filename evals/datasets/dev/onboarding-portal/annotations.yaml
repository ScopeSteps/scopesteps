  - id: EX-01
    kind: exclusion
    statement: Contracts are not signed in the portal; they stay in the e-signature tool.
    expect: exclude
    evidence:
      - { file: transcript.md, paragraph: 126, quote: 'Contracts stay in the e-signature tool' }
      - {
          file: supporting-hr-requirements.md,
          paragraph: 9,
          quote: 'Contract signing, which stays in the e-signature tool.',
        }

  - id: EX-02
    kind: exclusion
    statement: Probation reviews are not in the first release; they stay in the HR system.
    expect: exclude
