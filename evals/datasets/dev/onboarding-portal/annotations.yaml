          file: transcript-2-design-review.md,
          paragraph: 88,
          quote: 'The portal flags short-notice starters to the service desk so they get a loan laptop.',
        }

  - id: CR-09
    kind: confirmed_requirement
    statement: >-
      Starters sign in with their personal email and a one-time code, and access ends the day an
