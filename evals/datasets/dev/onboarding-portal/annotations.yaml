  - id: SE-02
    kind: sensitive
    statement: An unannounced resignation is confidential.
    expect: ignore
    evidence:
      - {
          file: transcript.md,
          paragraph: 90,
          quote: 'my team lead in claims is leaving at the end of next month',
        }

  - id: SE-03
    kind: sensitive
    statement: Gossip about an executive's pay is not a requirement.
    expect: ignore
    evidence:
      - {
          file: transcript-2-design-review.md,
          paragraph: 99,
          quote: 'the CEO got a thirty percent rise in April',
