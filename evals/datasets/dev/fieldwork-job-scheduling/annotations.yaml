  - id: CR-10
    kind: confirmed_requirement
    statement: The desk can flag a job as an emergency, which puts it at the top of a technician's list.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 67,
          quote: "the desk can flag a job as an emergency and it goes to the top of a technician's list",
