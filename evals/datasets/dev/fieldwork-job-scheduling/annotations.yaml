# Answer key for a synthetic company project written to read like a real one: long Teams
# transcripts with side talk, a charter and an email thread that disagree with the meetings.
# Paragraph numbers follow scopesteps.sources split_into_blocks: blocks separated by blank lines.
schema_version: 1
pack:
  id: fieldwork-job-scheduling
  title: Fieldwork job scheduling for water technicians
  difficulty: hard
  summary: >-
    A water company's mobile job scheduling app, from a brief, a requirements workshop, a
    follow-up meeting two weeks later, the project charter and an email thread. The workshop puts
    offline viewing into the first release against the approved charter; the follow-up drops the
    evening text to customers to pay for it, settles photo limits and retention, and moves the
    asset register to a weekly file. Location tracking waits for the union, whether technicians
    may edit access notes is left open, and the supplier assumes Dublin hosting while the brief
    says UK only. Both meetings drift into fishing, football, the Christmas party and the car
    park, and include remarks about a colleague's health, pay and another's disciplinary case.
    The change request asks to bring the South district into the first release.

annotations:
  - id: CR-01
    kind: confirmed_requirement
    statement: >-
      Each technician sees the day's jobs on their phone, in the order the desk sets, with the
      address, the customer's access notes and the parts each job needs.
    expect: include
    evidence:
      - {
          file: brief.md,
          paragraph: 7,
          quote: "Give each technician their day's jobs on a phone, in order",
        }
      - {
          file: transcript.md,
          paragraph: 15,
          quote: "the day's jobs on the phone, in the order they should do them, with the address, the access notes and the parts",
        }

  - id: CR-02
    kind: confirmed_requirement
    statement: >-
      Dispatchers see the status of every job and any dispatcher can move a job to another
      technician during the day.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 27,
          quote: 'dispatchers can see the status of every job and reassign a job to another technician during the day',
        }
      - { file: transcript.md, paragraph: 30, quote: "Let's say any dispatcher. Fine." }

  - id: CR-03
    kind: confirmed_requirement
    statement: A technician gets a notification when their list of jobs changes.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 27,
          quote: 'the technician gets a notification when their list changes',
        }

  - id: CR-04
    kind: confirmed_requirement
    statement: Technicians can see the day's jobs without a mobile signal, downloaded at the start of the day.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 37,
          quote: "The technician can see their day's jobs without signal in the first release.",
        }
      - {
          file: transcript-2-follow-up.md,
          paragraph: 10,
          quote: "seeing the day's jobs without signal, read only, downloaded at the start of the day",
        }

  - id: CR-05
    kind: confirmed_requirement
    statement: >-
      The technician completes the job record on the phone: the work done, the parts used and the
      start and finish times, with photos attached.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 46,
          quote: 'the technician completes the job record on the phone, what was done, the parts used and the times, with photos attached',
        }

  - id: CR-06
    kind: confirmed_requirement
    statement: A job record holds up to ten photos.
    expect: include
    evidence:
      - {
          file: transcript-2-follow-up.md,
          paragraph: 26,
          quote: "We'll allow up to ten photos per job.",
