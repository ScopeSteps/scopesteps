      - {
          file: supporting-charter.md,
          paragraph: 10,
          quote: 'Route planning or automatic ordering of jobs.',
        }

  - id: EX-05
    kind: exclusion
    statement: Completing a job without a signal waits for phase two.
    expect: exclude
    evidence:
