    statement: Photos are stored with the job record, not on the phone's camera roll.
    expect: include
    evidence:
      - {
          file: supporting-emails.md,
          paragraph: 14,
          quote: "stored with the job record and not on the phone's own camera roll",
        }

  - id: CR-08
    kind: confirmed_requirement
    statement: The customer signs when present, and a job can be closed without a signature.
    expect: include
    evidence:
      - {
          file: transcript.md,
          paragraph: 48,
          quote: "Signature when the customer's there, then, and the job can be closed without one.",
