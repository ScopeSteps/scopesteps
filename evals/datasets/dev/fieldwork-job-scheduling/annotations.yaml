          file: transcript.md,
          paragraph: 37,
          quote: 'Completing a job without signal waits for phase two.',
        }

  - id: PR-01
    kind: proposal
    statement: A website chatbot for customers to rebook is suggested and parked.
    expect: not_commit
    evidence:
      - {
          file: transcript.md,
          paragraph: 58,
          quote: 'we could put a little chatbot on the website',
        }
      - { file: transcript.md, paragraph: 60, quote: "Let's park the chatbot." }

  - id: CF-01
    kind: conflict
    statement: >-
      The approved charter puts offline working in phase two, and scope changes need the sponsor
      in writing; the workshop puts offline viewing into the first release by a spoken decision.
    expect: ask
    evidence:
      - {
          file: supporting-charter.md,
          paragraph: 12,
          quote: 'is planned for phase two, after release one',
        }
      - {
          file: transcript.md,
          paragraph: 37,
          quote: "The technician can see their day's jobs without signal in the first release.",
        }

  - id: CF-02
    kind: conflict
    statement: >-
      The brief keeps customer data in the United Kingdom; the supplier's statement of work assumes
      Dublin hosting, and the sponsor has not decided.
    expect: ask
    evidence:
      - { file: brief.md, paragraph: 11, quote: 'Customer data stays in the United Kingdom.' }
      - {
          file: supporting-emails.md,
          paragraph: 6,
          quote: 'Our standard hosting for new customers is our Dublin data centre',
        }
      - { file: supporting-emails.md, paragraph: 13, quote: "Please don't assume either way yet." }

  - id: MD-01
    kind: missing_decision
    statement: Whether and when technicians' locations are shown on a map waits for the union.
    expect: ask
    evidence:
      - {
          file: transcript.md,
          paragraph: 67,
          quote: "Whether we show technicians' locations on a map, and when, is open until we've talked to the union.",
        }
      - {
          file: transcript-2-follow-up.md,
          paragraph: 15,
          quote: "nothing's changed there, it's still open",
