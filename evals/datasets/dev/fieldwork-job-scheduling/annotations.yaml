  - id: MD-02
    kind: missing_decision
    statement: Whether technicians can add or edit access notes on site is not decided.
    expect: ask
    evidence:
      - {
          file: transcript-2-follow-up.md,
          paragraph: 41,
          quote: 'Can we come back to whether technicians can edit access notes?',
        }

  - id: OT-01
    kind: off_topic
    statement: The opening chat about fishing and under-tens football is not about the project.
    expect: ignore
    evidence:
      - { file: transcript.md, paragraph: 6, quote: 'My son caught a weed.' }
      - { file: transcript.md, paragraph: 7, quote: 'they lost nine nil' }

  - id: OT-02
    kind: off_topic
