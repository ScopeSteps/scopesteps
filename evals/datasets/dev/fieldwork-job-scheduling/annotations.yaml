  # Change run
  - id: CI-01
    kind: expected_change_impact
    statement: >-
      The request reverses the exclusion of the South district (EX-02). The agent must ask the
      sponsor rather than add the district silently.
    expect: ask
    relates_to: [EX-02]
    evidence:
      - {
          file: change_request.txt,
          paragraph: 2,
          quote: 'Please bring the South district into the first release.',
        }

